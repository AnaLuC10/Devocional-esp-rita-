<title>Devocional Espírita</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400;1,9..144,500&family=Lora:ital,wght@0,400;0,600;1,400&display=swap">
<style>
/* Layout: app de leitura de uma coluna (máx. 640px), barra de abas fixa embaixo, cabeçalhos em "aura" (degradê rosa, lilás e pêssego) */
:root{
  --bg:#FBF6F8; --surface:#FFFFFF; --ink:#3A2632; --muted:#80687A; --plum:#5B3A4A;
  --rose:#D9708F; --rose-l:#F2C3D1; --lav:#8F78C9; --lav-bg:#F2EDFB; --lav-ink:#463A62;
  --line:#EEDFE7; --accent:#C9577D; --on-accent:#FFFFFF; --ok:#8C6BC9;
  --a1:rgba(240,150,178,.95); --a2:rgba(178,152,232,.95); --a3:rgba(247,184,150,.95); --aw:rgba(255,255,255,.55); --abase:#EFD9E4;
  --s1:#FCE7EE; --s2:#EEE6FB; --s3:#FDEDE3;
  --shadow:0 1px 2px rgba(91,58,74,.06),0 8px 24px rgba(91,58,74,.07);
  --f-disp:'Fraunces',Georgia,'Times New Roman',serif;
  --f-read:'Lora',Georgia,'Times New Roman',serif;
  --f-ui:'DM Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --fs:17px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#17111A; --surface:#221923; --ink:#F2E8EE; --muted:#B9A2B1; --plum:#F5CFDE;
  --rose:#F09BB6; --rose-l:#6B3D50; --lav:#BDA9F0; --lav-bg:#2A2238; --lav-ink:#DCD1F7;
  --line:#352833; --accent:#F09BB6; --on-accent:#2A1520; --ok:#BDA9F0;
  --a1:rgba(196,86,128,.55); --a2:rgba(122,96,196,.55); --a3:rgba(196,118,86,.45); --aw:rgba(255,255,255,.06); --abase:#2A1C27;
  --s1:#2E1D27; --s2:#251F35; --s3:#2E221D;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#17111A; --surface:#221923; --ink:#F2E8EE; --muted:#B9A2B1; --plum:#F5CFDE;
  --rose:#F09BB6; --rose-l:#6B3D50; --lav:#BDA9F0; --lav-bg:#2A2238; --lav-ink:#DCD1F7;
  --line:#352833; --accent:#F09BB6; --on-accent:#2A1520; --ok:#BDA9F0;
  --a1:rgba(196,86,128,.55); --a2:rgba(122,96,196,.55); --a3:rgba(196,118,86,.45); --aw:rgba(255,255,255,.06); --abase:#2A1C27;
  --s1:#2E1D27; --s2:#251F35; --s3:#2E221D;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--lav);outline-offset:2px;border-radius:6px}
main{max-width:640px;margin:0 auto;padding-block:18px calc(96px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{text-wrap:balance}
.k{font-family:var(--f-ui);font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:999px;padding:12px 20px;
  font:600 15px/1 var(--f-ui);background:var(--accent);color:var(--on-accent);text-decoration:none;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.done{background:var(--lav-bg);color:var(--lav-ink)}

/* aura */
.aura{border-radius:28px;position:relative;overflow:hidden;color:var(--plum)}

/* abas */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--surface) 88%,transparent);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);
  padding:6px max(16px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.tabs nav{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.tabs a{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;text-decoration:none;color:var(--muted);font-size:11.5px;font-weight:500;border-radius:14px}
.tabs a svg{width:22px;height:22px}
.tabs a[aria-current="page"]{color:var(--accent)}

/* hoje */
.hello{display:flex;flex-direction:column;gap:2px;margin:6px 0 18px}
.hello h1{font:400 30px/1.1 var(--f-disp);margin:0;color:var(--plum)}
.hello h1 i{color:var(--rose)}
.hero{padding:22px 20px 20px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow)}
.hero .k{color:var(--plum);opacity:.8}
.hero .dn{font:italic 400 15px/1 var(--f-disp)}
.hero h2{font:500 21px/1.22 var(--f-disp);margin:2px 0 0}
.hero .meta{font-size:13px;opacity:.85}
.hero .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:8px;padding:9px 13px;border-radius:14px;background:color-mix(in srgb,var(--surface) 70%,transparent);
  color:var(--plum);text-decoration:none;font-size:13px;min-width:0;max-width:100%}
.chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip b{font-weight:700}
.dot{width:9px;height:9px;border-radius:50%;flex:none}
.note{font-size:13.5px;color:var(--muted);margin:12px 4px 0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:18px}
.stack{display:flex;flex-direction:column;gap:14px;margin-top:14px}
.prog{display:flex;flex-direction:column;gap:10px}
.prog .big{font:400 30px/1 var(--f-disp);color:var(--plum)}
.prog .big small{font:500 14px var(--f-ui);color:var(--muted)}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--rose),var(--lav))}
.prog .sub{font-size:13px;color:var(--muted)}
.week{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:4px}
.week a{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0;border-radius:14px;text-decoration:none;color:var(--ink);font-size:12px;font-variant-numeric:tabular-nums}
.week a .wd{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.08em}
.week a .c{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--line);font-weight:700;font-size:12px}
.week a.lido .c{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.week a.hoje .c{border-color:var(--accent);color:var(--accent)}
.week a.off{opacity:.45}
.vs-card .vs{font:italic 400 18px/1.45 var(--f-read);margin:6px 0 6px;color:var(--plum)}
.ref{font-size:12.5px;color:var(--muted)}

/* leitura */
.rbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:15;background:var(--bg);margin:-18px 0 14px;padding:10px 0 0}
.rbar .in{display:flex;align-items:center;gap:8px}
.rbar .t{flex:1;min-width:0;text-align:center;font:600 14px var(--f-ui);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;border:0;background:transparent;color:var(--ink);text-decoration:none;cursor:pointer;font:600 15px var(--f-ui)}
.ib svg{width:22px;height:22px}
.ib.on{color:var(--ok)}
.rprog{height:3px;margin-top:8px;background:var(--line);border-radius:3px;overflow:hidden}
.rprog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--rose),var(--lav))}
.dh{padding:22px 20px;display:flex;flex-direction:column;gap:4px}
.dh .dn{font:400 40px/1 var(--f-disp)}
.dh .dd{font-size:13.5px}
.dt{font:500 26px/1.2 var(--f-disp);margin:22px 0 6px;color:var(--plum)}
.dt .amp,.st .amp{font-style:italic;color:var(--rose)}
.pn{font-style:italic;font-size:.7em;color:var(--muted);font-weight:400}
.dm{font-size:13px;color:var(--muted);margin-bottom:18px}
.reader{font-family:var(--f-read);font-size:var(--fs);line-height:1.68}
.reader p{margin:0 0 .8em}
.st{font:italic 400 1.2em/1.25 var(--f-disp);color:var(--rose);margin:1.6em 0 .7em}
.q{margin:0 0 1.15em}
.qt{font-weight:600;margin:0 0 .35em!important;color:var(--plum)}
.qn{font-family:var(--f-disp);font-style:italic;font-weight:400;color:var(--rose);margin-right:2px}
.a p{padding-left:.8em;border-left:2px solid var(--rose-l);margin-bottom:.45em}
.com,.pq{background:var(--lav-bg);color:var(--lav-ink);border-radius:16px;padding:.8em 1em .3em;margin:.6em 0 .5em;font-size:.92em}
.pq{padding-bottom:.8em}
.pq{margin-bottom:.9em}
.lbl{display:block;font:700 10px/1.4 var(--f-ui);letter-spacing:.16em;text-transform:uppercase;color:var(--lav);margin-bottom:.35em}
.sig{text-align:right;font-style:italic;color:var(--muted);border:0!important;font-size:.9em}
.nota{border:1px solid var(--line);border-radius:16px;padding:.8em 1em .3em;margin:1em 0;font-size:.88em;background:var(--surface)}
.closing{margin-top:28px;display:flex;flex-direction:column;gap:0;background:var(--surface);border:1px solid var(--line);border-radius:24px;overflow:hidden}
.blk{padding:16px 18px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:6px;font-size:15px}
.blk:first-child{border-top:0}
.blk p{margin:0}
.bh{display:flex;align-items:center;gap:8px}
.bh span:last-child{font:700 11px var(--f-ui);letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.blk .vs{font:italic 400 17px/1.5 var(--f-read);color:var(--plum)}
.eps{margin:0;padding-left:18px}
.eps li{margin:2px 0}
.tag{font:700 10px var(--f-ui);letter-spacing:.12em;text-transform:uppercase;color:var(--lav);border:1px solid var(--line);border-radius:8px;padding:2px 6px;margin-left:4px;vertical-align:2px;white-space:nowrap}
.simples{margin-top:16px;border-radius:24px;padding:20px 20px 8px;background:linear-gradient(135deg,var(--s1),var(--s2) 55%,var(--s3));font-size:16px;line-height:1.6}
.simples p{margin:0 0 .8em}
.simples strong{color:var(--plum)}
.markbox{display:flex;flex-direction:column;align-items:center;gap:10px;margin:26px 0 8px;text-align:center}
.markbox .btn{width:100%;max-width:340px;padding:15px 20px;font-size:16px}
.pager{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.pager a{display:flex;flex-direction:column;gap:2px;padding:12px 14px;border:1px solid var(--line);border-radius:18px;text-decoration:none;color:var(--ink);min-width:0}
.pager a.nx{text-align:right}
.pager a small{color:var(--muted);font-size:12px}
.pager a span{font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* cronograma */
.ph{margin:6px 0 16px}
.ph h1{font:400 30px/1.1 var(--f-disp);margin:2px 0 6px;color:var(--plum)}
.ph h1 i{color:var(--rose)}
.ph p{margin:0;color:var(--muted);font-size:14px}
.mes{font:italic 400 18px var(--f-disp);color:var(--rose);margin:22px 4px 8px;text-transform:lowercase}
.list{background:var(--surface);border:1px solid var(--line);border-radius:22px;overflow:hidden}
.it{display:grid;grid-template-columns:44px 1fr;align-items:center;border-top:1px solid var(--line)}
.it:first-child{border-top:0}
.it .tg{width:44px;height:100%;min-height:56px;display:grid;place-items:center;background:none;border:0;cursor:pointer;padding:0}
.it .tg i{width:20px;height:20px;border-radius:50%;border:1.6px solid var(--line);display:grid;place-items:center;color:var(--surface);font-style:normal;font-size:12px}
.it.lido .tg i{background:var(--ok);border-color:var(--ok)}
.it a{display:grid;grid-template-columns:52px 1fr;gap:10px;padding:11px 14px 11px 0;text-decoration:none;color:var(--ink);min-width:0}
.it .when{font-variant-numeric:tabular-nums;font-size:12px;color:var(--muted);line-height:1.3}
.it .when b{display:block;font:500 16px var(--f-disp);color:var(--plum)}
.it .what{min-width:0;font-size:14.5px;line-height:1.35}
.it .what small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.it.hoje{background:color-mix(in srgb,var(--rose-l) 30%,var(--surface))}
.it.hoje .when b::after{content:" · hoje";font:700 10px var(--f-ui);letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.it.atraso .when b{color:var(--accent)}
.it.lido .what{color:var(--muted)}

/* sobre */
.steps{display:flex;flex-direction:column;gap:14px}
.step{display:grid;grid-template-columns:30px 1fr;gap:10px;font-size:14.5px}
.step .sn{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--lav-bg);color:var(--lav-ink);font:600 14px var(--f-disp)}
.seg{display:inline-grid;grid-auto-flow:column;gap:4px;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:4px}
.seg button{border:0;background:none;border-radius:999px;padding:8px 14px;font:600 14px var(--f-ui);color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.fine{font-size:12.5px;color:var(--muted)}
.nm{display:flex;flex-direction:column;gap:10px;margin-bottom:14px}
.nmrow{display:flex;gap:8px}
.nmrow input{flex:1;min-width:0;border:1px solid var(--line);border-radius:999px;padding:11px 16px;font:16px var(--f-ui);background:var(--bg);color:var(--ink)}
.sync{display:flex;align-items:center;gap:8px;font-size:13.5px}

.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(8px);background:var(--plum);color:var(--bg);
  padding:10px 16px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;z-index:40;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media (prefers-reduced-motion: reduce){.toast{transition:none}}
</style>

<script type="application/json" id="data">__DATA__</script>
<script>
(function(){
const DATA = JSON.parse(document.getElementById('data').textContent);
const DAYS = DATA.days, EXTRAS = DATA.extras;
let PODS = {};
const busca = d => 'https://open.spotify.com/search/' + encodeURIComponent('palestra espírita ' + d.tema.replace(/&amp;/g,'&')) + '/episodes';
fetch('podcasts.json', {cache:'no-store'}).then(r => r.ok ? r.json() : {}).then(j => { PODS = j || {}; if (typeof render === 'function') render(false); }).catch(() => {});
const MESES=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const SEM=['domingo','segunda-feira','terça-feira','quarta-feira','quinta-feira','sexta-feira','sábado'];
const AURAS=[['15% 20%','85% 35%','45% 95%'],['80% 15%','10% 60%','70% 90%'],['30% 85%','90% 70%','20% 10%'],['60% 10%','5% 40%','95% 95%'],['10% 90%','75% 25%','40% 40%'],['90% 85%','25% 20%','55% 60%']];
const aura = k => { const [a,b,c]=AURAS[k%AURAS.length];
  return `background:radial-gradient(circle at 50% 50%,var(--aw) 0,transparent 32%),radial-gradient(circle at ${a},var(--a1) 0,transparent 62%),radial-gradient(circle at ${b},var(--a2) 0,transparent 62%),radial-gradient(circle at ${c},var(--a3) 0,transparent 62%),var(--abase)`; };
const COR = {flor:'#E79AB0',livro:'#A893D6',biblia:'#D8A2C4',fone:'#F2B79A',nota:'#C9A3E3'};
const dot = k => `<span class="dot" style="background:${COR[k]}"></span>`;
const pd = iso => { const [y,m,d]=iso.split('-').map(Number); return new Date(y,m-1,d); };
const longo = iso => { const d=pd(iso); return `${SEM[d.getDay()]}, ${d.getDate()} de ${MESES[d.getMonth()]}`; };
const curto = iso => { const d=pd(iso); return `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}`; };
const todayISO = () => { const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };
const byN = n => DAYS[n-1];
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $app = document.getElementById('app');

/* ---------- estado: lidos + tamanho da letra ---------- */
const LS='lde-devocional-v1';
let state = { lidos: [], extras: [], fs: 17, t: 0, nome: '' };
try { const s = JSON.parse(localStorage.getItem(LS)||'null'); if (s && Array.isArray(s.lidos)) state = Object.assign(state, s); } catch(e){}
let lidos = new Set(state.lidos), extrasLidos = new Set(state.extras||[]);
let remote = null, syncMsg = 'Seu progresso fica salvo neste aparelho.';
function persist(){
  state.lidos=[...lidos].sort((a,b)=>a-b); state.extras=[...extrasLidos].sort((a,b)=>a-b); state.t=Date.now();
  try { localStorage.setItem(LS, JSON.stringify(state)); } catch(e){}
  if (remote) remote.set({lidos:state.lidos, extras:state.extras, fs:state.fs, t:state.t, nome:state.nome}).catch(()=>{});
}
function applyFs(){ document.documentElement.style.setProperty('--fs', state.fs+'px'); }
applyFs();

(async function sync(){
  try{
    if (!window.claude || !claude.use) return;
    const [db, user] = await Promise.all([claude.use('db'), claude.use('user')]);
    if (!db || !user) return;
    const id = await user.id(); if (!id) return;
    const dona = user.isOwner && user.isOwner();
    if (dona && !state.nome) state.nome = 'Ana';
    if (dona && !state.t && !lidos.size) { DAYS.filter(d=>d.done).forEach(d=>lidos.add(d.n)); }
    remote = db.doc('data/users/'+id+'/progresso');
    remote.onSnapshot(snap => {
      if (!snap.exists) { persist(); render(false); return; }
      const r = snap.data();
      if ((r.t||0) > (state.t||0)) {
        state = Object.assign(state, r); lidos = new Set(r.lidos||[]); extrasLidos = new Set(r.extras||[]);
        try { localStorage.setItem(LS, JSON.stringify(state)); } catch(e){}
        applyFs(); render(false);
      }
    }, () => {});
    syncMsg = 'Seu progresso fica salvo na sua conta e aparece igual no celular e no computador.';
    if (location.hash==='#sobre') render(false);
  } catch(e){}
})();

function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toast.h); toast.h=setTimeout(()=>t.classList.remove('show'),1800); }
function toggle(n){ if (lidos.has(n)) { lidos.delete(n); toast('Desmarcado'); } else { lidos.add(n); toast('Leitura marcada como lida ♡'); } persist(); }

/* ---------- views ---------- */
function plan(){
  const t = todayISO();
  const hoje = DAYS.find(d=>d.date===t);
  const firstUnread = DAYS.find(d=>!lidos.has(d.n));
  const atrasadas = DAYS.filter(d=>d.date<t && !lidos.has(d.n));
  let alvo, rot;
  if (hoje && !lidos.has(hoje.n) && !atrasadas.length) { alvo=hoje; rot='leitura de hoje'; }
  else if (atrasadas.length) { alvo=atrasadas[0]; rot = atrasadas.length===1 && !hoje ? 'ficou pra trás' : 'continuar de onde parou'; }
  else if (firstUnread) { alvo=firstUnread; rot = firstUnread.date===t ? 'leitura de hoje' : 'próxima leitura · '+longo(firstUnread.date); }
  return {t, hoje, alvo, rot, atrasadas};
}

function vHoje(){
  const {t, hoje, alvo, rot, atrasadas} = plan();
  const h = new Date().getHours();
  const saud = h<12 ? 'Bom dia' : h<18 ? 'Boa tarde' : 'Boa noite';
  let o = `<div class="hello"><span class="k">${longo(t)}</span><h1>${saud}${state.nome?`, <i>${esc(state.nome)}</i>`:' <i>♡</i>'}</h1></div>`;
  if (!state.nome) o += `<form class="card nm" id="nmForm"><label for="nmIn" class="k">como você quer ser chamada?</label><div class="nmrow"><input id="nmIn" name="nome" autocomplete="given-name" placeholder="Seu nome" maxlength="30"><button class="btn" type="submit">Salvar</button></div></form>`;
  if (alvo){
    o += `<section class="aura hero" style="${aura(alvo.n)}">
      <span class="k">${rot}</span>
      <div><div class="dn">Dia ${alvo.n}</div><h2>${alvo.short}</h2></div>
      <div class="meta">${alvo.q} · ≈ ${alvo.mins} min de leitura</div>
      <div class="row"><a class="btn" href="#dia-${alvo.n}">Ler agora</a></div>
      <div class="row">
        ${PODS[alvo.n] ? `<a class="chip" href="${esc(PODS[alvo.n].url)}" target="_blank" rel="noopener">${dot('fone')}<span><b>Podcast</b> · ${esc(PODS[alvo.n].nome)}</span></a>` : `<a class="chip" href="${busca(alvo)}" target="_blank" rel="noopener">${dot('fone')}<span><b>Podcast</b> · palestras sobre o tema</span></a>`}
        <a class="chip" href="${alvo.musUrl}" target="_blank" rel="noopener">${dot('nota')}<span><b>Música</b> · ${alvo.mus} – ${alvo.art}</span></a>
      </div></section>`;
    if (hoje && lidos.has(hoje.n) && alvo.n!==hoje.n) o += `<p class="note">A leitura de hoje (Dia ${hoje.n}) já está feita ♡</p>`;
    else if (!hoje) o += `<p class="note">Hoje não tem leitura no cronograma. ${atrasadas.length? 'Dá pra pôr em dia, sem pressa.' : 'Aproveite o descanso.'}</p>`;
    if (atrasadas.length>1) o += `<p class="note">${atrasadas.length} leituras pra pôr em dia. É só seguir na ordem.</p>`;
  } else {
    o += `<section class="aura hero" style="${aura(2)}"><span class="k">fim</span><h2>Você leu o livro inteiro ♡</h2><p>“Fora da caridade não há salvação.”</p></section>`;
  }
  const nl = lidos.size, pct = Math.round(nl/DAYS.length*100);
  o += `<div class="stack"><section class="card prog"><span class="k">seu caminho</span>
     <div class="big">${nl} <small>de ${DAYS.length} leituras · ${pct}%</small></div>
     <div class="bar"><i style="width:${pct}%"></i></div>
     <div class="sub">Termina em ${longo(DAYS[DAYS.length-1].date)} de ${DAYS[DAYS.length-1].date.slice(0,4)}, se seguir o cronograma.</div>
     ${semana(alvo)}</section>`;
  const vd = alvo || DAYS[DAYS.length-1];
  o += `<section class="card vs-card"><div class="bh">${dot('biblia')}<span class="k">na Bíblia · Dia ${vd.n}</span></div>
     <p class="vs">“${vd.bib}”</p><div class="ref">${vd.bref} · Bíblia Livre</div></section>
     <section class="card"><div class="bh">${dot('flor')}<span class="k">pra hoje</span></div><p style="margin:8px 0 0;font-size:15px">${vd.hoje}</p></section></div>`;
  return o;
}
function semana(alvo){
  const ref = alvo ? pd(alvo.date) : new Date();
  const seg = new Date(ref); seg.setDate(ref.getDate() - ((ref.getDay()+6)%7));
  const t = todayISO(); let o = '<div class="week">';
  for (let i=0;i<5;i++){ const d=new Date(seg); d.setDate(seg.getDate()+i);
    const iso=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    const dd = DAYS.find(x=>x.date===iso); const wd = SEM[d.getDay()].slice(0,3);
    if (!dd) { o += `<a class="off" aria-disabled="true"><span class="wd">${wd}</span><span class="c">–</span>${d.getDate()}</a>`; continue; }
    const cls = lidos.has(dd.n)?'lido':(iso===t?'hoje':'');
    o += `<a class="${cls}" href="#dia-${dd.n}" aria-label="Dia ${dd.n}, ${longo(iso)}${lidos.has(dd.n)?', lido':''}"><span class="wd">${wd}</span><span class="c">${lidos.has(dd.n)?'✓':dd.n}</span>${curto(iso)}</a>`; }
  return o + '</div>';
}

function podBlk(d){
  const p = PODS[d.n];
  if (p) return `<p><a href="${esc(p.url)}" target="_blank" rel="noopener"><strong>${esc(p.nome)}</strong></a></p><p class="ref">${esc(p.programa||'')}${p.min?` · ${esc(p.min)} min`:''}</p>${p.por?`<p>${esc(p.por)}</p>`:''}`;
  return `<p>A palestra do dia aparece aqui de manhã cedo.</p><p><a href="${busca(d)}" target="_blank" rel="noopener">Procurar palestras sobre “${d.tema}” no Spotify</a></p>`;
}
function vDia(n){
  const d = byN(n); if (!d) return vHoje();
  const lido = lidos.has(n), p = byN(n-1), nx = byN(n+1);
  return `<div class="rbar"><div class="in">
      <a class="ib" href="#cronograma" aria-label="Voltar ao cronograma"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M15 5l-7 7 7 7"/></svg></a>
      <div class="t">Dia ${n} · ${curto(d.date)}</div>
      <button class="ib" id="fsBtn" aria-label="Tamanho da letra">Aa</button>
      <button class="ib ${lido?'on':''}" id="chkTop" aria-pressed="${lido}" aria-label="Marcar como lido"><svg viewBox="0 0 24 24" fill="${lido?'currentColor':'none'}" stroke="currentColor" stroke-width="1.8"><path d="M12 20s-7.5-4.4-7.5-10A4.3 4.3 0 0 1 12 7.6 4.3 4.3 0 0 1 19.5 10c0 5.6-7.5 10-7.5 10z"/></svg></button>
    </div><div class="rprog"><i id="rp"></i></div></div>
    <header class="aura dh" style="${aura(n)}"><span class="k">${d.part==='5'?'Conclusão':DATA.parts[d.part][0]}</span><div class="dn">Dia ${n}</div><div class="dd">${longo(d.date)} · ≈ ${d.mins} min de leitura</div></header>
    <h1 class="dt">${d.title}</h1><div class="dm">${d.meta}</div>
    <article class="reader">${d.body}</article>
    <section class="closing">
      <div class="blk"><div class="bh">${dot('flor')}<span>pra hoje</span></div><p>${d.hoje}</p></div>
      ${d.ese?`<div class="blk"><div class="bh">${dot('livro')}<span>no Evangelho</span></div><p class="ref">O Evangelho segundo o Espiritismo · ${d.ese}</p><p>${d.liga}</p></div>`:''}
      <div class="blk"><div class="bh">${dot('biblia')}<span>na Bíblia</span></div><p class="vs">“${d.bib}”</p><p class="ref">${d.bref} · Bíblia Livre</p></div>
      <div class="blk"><div class="bh">${dot('fone')}<span>podcast do dia</span></div>${podBlk(d)}</div>
      <div class="blk"><div class="bh">${dot('nota')}<span>música do dia</span></div><p><a href="${d.musUrl}" target="_blank" rel="noopener"><strong>${d.mus}</strong> – ${d.art}</a> <span class="tag">${d.gen}</span></p>
        <p class="ref">Também na <a href="https://open.spotify.com/playlist/3bJwoEHzmIxIKBF4450uU3" target="_blank" rel="noopener">sua playlist do devocional</a>.</p></div>
    </section>
    <section class="simples"><span class="lbl">explicando de um jeito simples</span>${d.simples}</section>
    <div class="markbox"><button class="btn ${lido?'done':''}" id="chkBig">${lido?'Lido ♡ · toque pra desmarcar':'Marcar como lido'}</button></div>
    <nav class="pager" aria-label="Outros dias">
      ${p?`<a href="#dia-${p.n}"><small>‹ Dia ${p.n}</small><span>${p.short}</span></a>`:'<span></span>'}
      ${nx?`<a class="nx" href="#dia-${nx.n}"><small>Dia ${nx.n} ›</small><span>${nx.short}</span></a>`:'<span></span>'}
    </nav>`;
}

function vExtra(i){
  const e = EXTRAS[i-1]; if (!e) return vCrono();
  const lido = extrasLidos.has(i);
  return `<div class="rbar"><div class="in">
      <a class="ib" href="#cronograma" aria-label="Voltar ao cronograma"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M15 5l-7 7 7 7"/></svg></a>
      <div class="t">Leitura extra ${i}</div><button class="ib" id="fsBtn" aria-label="Tamanho da letra">Aa</button><span class="ib"></span>
    </div><div class="rprog"><i id="rp"></i></div></div>
    <header class="aura dh" style="${aura(i+3)}"><span class="k">leitura extra · quando quiser</span><div class="dn">Extra ${i}</div><div class="dd">≈ ${e.mins} min de leitura</div></header>
    <h1 class="dt">${e.name}</h1><div class="dm">Introdução e Prolegômenos de Kardec</div>
    <article class="reader">${e.body}</article>
    <div class="markbox"><button class="btn ${lido?'done':''}" id="chkExtra">${lido?'Lido ♡ · toque pra desmarcar':'Marcar como lido'}</button></div>
    <nav class="pager">${EXTRAS[i-2]?`<a href="#extra-${i-1}"><small>‹ Extra ${i-1}</small><span>${EXTRAS[i-2].name}</span></a>`:'<span></span>'}${EXTRAS[i]?`<a class="nx" href="#extra-${i+1}"><small>Extra ${i+1} ›</small><span>${EXTRAS[i].name}</span></a>`:'<span></span>'}</nav>`;
}

function vCrono(){
  const t = todayISO(), nl = lidos.size;
  let o = `<div class="ph"><span class="k">seu caminho</span><h1>Crono<i>grama</i></h1><p>${nl} de ${DAYS.length} leituras feitas. Toque no círculo pra marcar e no tema pra ler.</p></div>`;
  let mes = '';
  DAYS.forEach((d,ix) => {
    const m = d.date.slice(0,7);
    if (m!==mes){ if (mes) o += '</div>'; mes=m; const dd=pd(d.date); o += `<h2 class="mes">${MESES[dd.getMonth()]} ${dd.getFullYear()}</h2><div class="list">`; }
    const l = lidos.has(d.n), cls = ['it', l?'lido':'', d.date===t?'hoje':'', (!l && d.date<t)?'atraso':''].join(' ');
    o += `<div class="${cls}" id="c${d.n}"><button class="tg" data-n="${d.n}" aria-pressed="${l}" aria-label="Dia ${d.n}: ${l?'lido':'não lido'}"><i>${l?'✓':''}</i></button>
      <a href="#dia-${d.n}"><span class="when"><b>Dia ${d.n}</b>${curto(d.date)} ${SEM[pd(d.date).getDay()].slice(0,3)}</span><span class="what">${d.short}<small>${d.q} · ${d.mins} min</small></span></a></div>`;
  });
  o += '</div>';
  o += `<h2 class="mes">leituras extras</h2><p class="note" style="margin:-4px 4px 10px">A Introdução e os Prolegômenos de Kardec, pra ler quando quiser.</p><div class="list">`;
  EXTRAS.forEach(e => { const l=extrasLidos.has(e.i);
    o += `<div class="it ${l?'lido':''}"><button class="tg" data-x="${e.i}" aria-pressed="${l}" aria-label="Extra ${e.i}: ${l?'lido':'não lido'}"><i>${l?'✓':''}</i></button>
      <a href="#extra-${e.i}"><span class="when"><b>E${e.i}</b></span><span class="what">${e.name}<small>${e.mins} min</small></span></a></div>`; });
  o += '</div><p class="note">Sem leitura nos fins de semana e feriados nacionais (20/11, 25/12, 1º/01 e Carnaval). Se pular um dia, é só continuar de onde parou.</p>';
  return o;
}

function vSobre(){
  const fsOpts=[[15,'A'],[17,'A'],[19,'A'],[21,'A']];
  return `<div class="ph"><span class="k">antes de começar</span><h1>Como <i>usar</i></h1></div>
  <div class="stack" style="margin-top:0">
  <section class="card"><div class="steps">
    <div class="step"><div class="sn">1</div><div><b>De manhã, o podcast.</b> Uma palestra ou conversa sobre o tema do dia, trazendo o Evangelho e um olhar diferente. A indicação aparece no dia, de manhã cedo.</div></div>
    <div class="step"><div class="sn">2</div><div><b>À noite, a leitura.</b> O texto original do livro: perguntas de Kardec, respostas dos Espíritos (com a linha rosa) e comentários de Kardec (nos quadros lilás).</div></div>
    <div class="step"><div class="sn">3</div><div><b>Pra fechar.</b> Uma ideia pra hoje, a ligação com <i>O Evangelho segundo o Espiritismo</i>, um trecho da Bíblia e a música do dia.</div></div>
    <div class="step"><div class="sn">4</div><div><b>Ficou difícil?</b> No fim de cada dia tem a explicação simples, com as ideias principais em linguagem do dia a dia.</div></div>
    <div class="step"><div class="sn">5</div><div><b>Toque no ♡.</b> Marca a leitura como lida. A aba Hoje sempre abre na próxima leitura.</div></div>
  </div></section>
  <section class="card"><span class="k">tamanho da letra</span>
    <div style="margin-top:10px" class="seg" role="group" aria-label="Tamanho da letra">${fsOpts.map(([v,l],i)=>`<button data-fs="${v}" aria-pressed="${state.fs===v}" style="font-size:${12+i*2.5}px">${l}</button>`).join('')}</div>
    <p class="reader" style="margin:12px 0 0">“Deus é a inteligência suprema, causa primária de todas as coisas.”</p></section>
  <section class="card"><div class="sync">${dot('livro')}<span>${syncMsg}</span></div></section>
  <p class="fine">Texto integral d'<i>O Livro dos Espíritos</i>, de Allan Kardec, na tradução de Guillon Ribeiro (FEB – Federação Espírita Brasileira), em domínio público. As notas da editora ficaram de fora; as notas do próprio Kardec estão no fim de cada dia. Trechos bíblicos da Bíblia Livre (BLIVRE), licença Creative Commons Atribuição 3.0 Brasil.</p>
  </div>`;
}

/* ---------- roteador ---------- */
let lastView = '';
function render(scroll=true){
  const h = (location.hash||'#hoje').slice(1);
  let html, tab='hoje', m;
  if ((m=h.match(/^dia-(\d+)$/))) { html=vDia(+m[1]); tab='cronograma'; }
  else if ((m=h.match(/^extra-(\d+)$/))) { html=vExtra(+m[1]); tab='cronograma'; }
  else if (h==='cronograma') { html=vCrono(); tab='cronograma'; }
  else if (h==='sobre') { html=vSobre(); tab='sobre'; }
  else html=vHoje();
  const y = window.scrollY;
  $app.innerHTML = html;
  document.querySelectorAll('.tabs a').forEach(a=>{ if(a.dataset.tab===tab) a.setAttribute('aria-current','page'); else a.removeAttribute('aria-current'); });
  if (scroll && h!==lastView) {
    if (h==='cronograma') { const p=plan(); const el=p.alvo && document.getElementById('c'+p.alvo.n); window.scrollTo(0, el ? Math.max(0, el.getBoundingClientRect().top + window.scrollY - 160) : 0); }
    else window.scrollTo(0,0);
  } else window.scrollTo(0,y);
  lastView = h;
  document.title = 'Devocional Espírita';
  onScroll();
}
window.addEventListener('hashchange', ()=>render(true));

$app.addEventListener('click', e => {
  const tg = e.target.closest('.tg');
  if (tg && tg.dataset.n) { toggle(+tg.dataset.n); render(false); return; }
  if (tg && tg.dataset.x) { const i=+tg.dataset.x; extrasLidos.has(i)?extrasLidos.delete(i):extrasLidos.add(i); persist(); render(false); return; }
  const m = (location.hash||'').match(/^#dia-(\d+)$/);
  if (e.target.closest('#chkTop')) { toggle(+m[1]); render(false); return; }
  if (e.target.closest('#chkBig')) { toggle(+m[1]); render(false); return; }
  if (e.target.closest('#chkExtra')) { const i=+location.hash.match(/\d+/)[0]; extrasLidos.has(i)?(extrasLidos.delete(i),toast('Desmarcado')):(extrasLidos.add(i),toast('Leitura marcada como lida ♡')); persist(); render(false); return; }
  if (e.target.closest('#fsBtn')) { const s=[15,17,19,21]; state.fs = s[(s.indexOf(state.fs)+1)%s.length] || 17; applyFs(); persist(); toast('Letra '+['pequena','normal','grande','maior'][s.indexOf(state.fs)]); onScroll(); return; }
  const fb = e.target.closest('[data-fs]');
  if (fb) { state.fs=+fb.dataset.fs; applyFs(); persist(); render(false); }
});

function onScroll(){
  const rp = document.getElementById('rp'); if (!rp) return;
  const art = document.querySelector('.reader'); if (!art) return;
  const top = art.getBoundingClientRect().top + window.scrollY, h = art.offsetHeight - window.innerHeight*0.6;
  const p = Math.min(1, Math.max(0, (window.scrollY - top + window.innerHeight*0.3) / Math.max(1,h)));
  rp.style.width = (p*100).toFixed(1)+'%';
}
window.addEventListener('scroll', onScroll, {passive:true});
$app.addEventListener('submit', e => { if (e.target.id!=='nmForm') return; e.preventDefault(); const v=document.getElementById('nmIn').value.trim(); if (!v) return; state.nome=v.slice(0,30); persist(); render(false); toast('Prazer, '+state.nome+' ♡'); });

/* links externos sempre em nova aba */
$app.addEventListener('click', e => { const a=e.target.closest('a[href^="http"]'); if (a) { a.target='_blank'; a.rel='noopener'; } }, true);

render(true);
})();
</script>
