<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bíblia"><meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#FBF7F2">
<link rel="apple-touch-icon" href="icone-180.png"><link rel="icon" href="icone-180.png"><link rel="manifest" href="manifest.webmanifest">
<title>Bíblia</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400;1,9..144,500&family=Lora:ital,wght@0,400;0,600;1,400&display=swap">
<style>
/* Bíblia na visão espírita. App de leitura de uma coluna (máx. 640px), abas fixas embaixo,
   cabeçalhos em "aura" (degradê terracota, azul do mar da Galileia e trigo). Mesmo estilo do Devocional Espírita. */
:root{
  --bg:#FBF7F2; --surface:#FFFFFF; --ink:#33251F; --muted:#7D6A60; --plum:#4A2C22;
  --rose:#B5583A; --rose-l:#F1CDBD; --lav:#3D7393; --lav-bg:#E8F0F6; --lav-ink:#2B4A5E;
  --line:#EEE3DA; --accent:#A9502F; --on-accent:#FFFFFF; --ok:#4F86A8;
  --a1:rgba(226,150,120,.95); --a2:rgba(130,178,206,.95); --a3:rgba(238,204,140,.95); --aw:rgba(255,255,255,.55); --abase:#F0E2D6;
  --s1:#FBE8DF; --s2:#E6F0F6; --s3:#FBF1DD;
  --shadow:0 1px 2px rgba(74,44,34,.06),0 8px 24px rgba(74,44,34,.07);
  --f-disp:'Fraunces',Georgia,'Times New Roman',serif;
  --f-read:'Lora',Georgia,'Times New Roman',serif;
  --f-ui:'DM Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --fs:17px;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#16110F; --surface:#211915; --ink:#F3EAE4; --muted:#BBA79C; --plum:#F6D6C7;
  --rose:#EE9B7C; --rose-l:#6A3B2C; --lav:#9CC4DE; --lav-bg:#1F2A33; --lav-ink:#CFE3F0;
  --line:#36291F; --accent:#EE9B7C; --on-accent:#2A140C; --ok:#9CC4DE;
  --a1:rgba(190,100,70,.5); --a2:rgba(80,130,165,.5); --a3:rgba(190,150,80,.45); --aw:rgba(255,255,255,.06); --abase:#2A1D17;
  --s1:#2E1E17; --s2:#1C2830; --s3:#2D2617;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--lav);outline-offset:2px;border-radius:6px}
main{max-width:640px;margin:0 auto;padding-block:calc(18px + env(safe-area-inset-top,0px)) calc(96px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{text-wrap:balance}
.k{font-family:var(--f-ui);font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:999px;padding:12px 20px;
  font:600 15px/1 var(--f-ui);background:var(--accent);color:var(--on-accent);text-decoration:none;cursor:pointer}
.btn.done{background:var(--lav-bg);color:var(--lav-ink)}
.aura{border-radius:28px;position:relative;overflow:hidden;color:var(--plum)}
.dot{width:9px;height:9px;border-radius:50%;flex:none}

/* abas */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--surface) 88%,transparent);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);
  padding:6px max(16px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.tabs nav{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.tabs a{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;text-decoration:none;color:var(--muted);font-size:11.5px;font-weight:500;border-radius:14px}
.tabs a svg{width:22px;height:22px}
.tabs a[aria-current="page"]{color:var(--accent)}

/* hoje */
.hello{display:flex;flex-direction:column;gap:2px;margin:6px 0 18px}
.hello h1{font:400 30px/1.1 var(--f-disp);margin:0;color:var(--plum)}
.hello h1 i{color:var(--rose)}
.hero{padding:22px 20px 20px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow)}
.hero .k{color:var(--plum);opacity:.8}
.hero .dn{font:italic 400 15px/1 var(--f-disp)}
.hero h2{font:500 22px/1.22 var(--f-disp);margin:2px 0 0}
.hero .meta{font-size:13.5px;opacity:.88}
.note{font-size:13.5px;color:var(--muted);margin:12px 4px 0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:18px}
.stack{display:flex;flex-direction:column;gap:14px;margin-top:14px}
.prog{display:flex;flex-direction:column;gap:10px}
.prog .big{font:400 30px/1 var(--f-disp);color:var(--plum)}
.prog .big small{font:500 14px var(--f-ui);color:var(--muted)}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--rose),var(--ok))}
.prog .sub{font-size:13px;color:var(--muted)}
.week{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:4px}
.week a{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0;border-radius:14px;text-decoration:none;color:var(--ink);font-size:12px;font-variant-numeric:tabular-nums}
.week a .wd{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.08em}
.week a .c{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--line);font-weight:700;font-size:12px}
.week a.lido .c{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.week a.hoje .c{border-color:var(--accent);color:var(--accent)}
.week a.off{opacity:.45}
.bh{display:flex;align-items:center;gap:8px}
.bh span:last-child{font:700 11px var(--f-ui);letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.vs{font:italic 400 18px/1.5 var(--f-read);margin:8px 0 6px;color:var(--plum)}
.ref{font-size:12.5px;color:var(--muted)}

/* leitura */
.rbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:15;background:var(--bg);margin:-18px 0 14px;padding:10px 0 0}
.rbar .in{display:flex;align-items:center;gap:8px}
.rbar .t{flex:1;min-width:0;text-align:center;font:600 14px var(--f-ui);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;border:0;background:transparent;color:var(--ink);text-decoration:none;cursor:pointer;font:600 15px var(--f-ui)}
.ib svg{width:22px;height:22px}
.ib.on{color:var(--rose)}
.rprog{height:3px;margin-top:8px;background:var(--line);border-radius:3px;overflow:hidden}
.rprog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--rose),var(--ok))}
.dh{padding:22px 20px;display:flex;flex-direction:column;gap:4px}
.dh .dn{font:400 40px/1 var(--f-disp)}
.dh .dd{font-size:13.5px}
.dt{font:500 26px/1.2 var(--f-disp);margin:22px 0 4px;color:var(--plum)}
.dm{font-size:14px;color:var(--muted);margin-bottom:18px}
.dm b{color:var(--rose);font-weight:600}
.reader{font-family:var(--f-read);font-size:var(--fs);line-height:1.7}
.reader .bl{font:400 1.5em/1.2 var(--f-disp);color:var(--plum);margin:1.4em 0 .2em}
.reader .cap{font:italic 400 1.15em/1.25 var(--f-disp);color:var(--rose);margin:1.5em 0 .5em}
.reader .bl + .cap,.reader > .cap:first-child{margin-top:.4em}
.reader .sobre{font-style:italic;color:var(--muted);font-size:.9em;margin:0 0 .5em}
.reader .vv{margin:0 0 .8em}
.reader sup{font:700 .58em var(--f-ui);color:var(--rose);margin:0 .22em 0 .1em;vertical-align:.55em;line-height:0}
.reader .vk{background:color-mix(in srgb,var(--a3) 30%,transparent);border-radius:4px;box-decoration-break:clone;-webkit-box-decoration-break:clone;padding:0 2px}
.loading{color:var(--muted);font-style:italic}
.esp{margin-top:26px;border-radius:24px;padding:20px 20px 8px;background:linear-gradient(135deg,var(--s1),var(--s2) 55%,var(--s3));font-size:16px;line-height:1.62}
.esp p{margin:0 0 .85em}
.esp strong{color:var(--plum)}
.esp .conv{background:color-mix(in srgb,var(--surface) 60%,transparent);border-radius:16px;padding:.7em .9em;font-size:.95em}
.lbl{display:block;font:700 10.5px/1.4 var(--f-ui);letter-spacing:.16em;text-transform:uppercase;color:var(--lav);margin-bottom:.5em}
.closing{margin-top:14px;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:24px;overflow:hidden}
.blk{padding:16px 18px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:6px;font-size:15px}
.blk:first-child{border-top:0}
.blk p{margin:0}
.markbox{display:flex;flex-direction:column;align-items:center;gap:10px;margin:26px 0 8px;text-align:center}
.markbox .btn{width:100%;max-width:340px;padding:15px 20px;font-size:16px}
.pager{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.pager a{display:flex;flex-direction:column;gap:2px;padding:12px 14px;border:1px solid var(--line);border-radius:18px;text-decoration:none;color:var(--ink);min-width:0}
.pager a.nx{text-align:right}
.pager a small{color:var(--muted);font-size:12px}
.pager a span{font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* cronograma */
.ph{margin:6px 0 16px}
.ph h1{font:400 30px/1.1 var(--f-disp);margin:2px 0 6px;color:var(--plum)}
.ph h1 i{color:var(--rose)}
.ph p{margin:0;color:var(--muted);font-size:14px}
.mes{font:italic 400 18px var(--f-disp);color:var(--rose);margin:22px 4px 8px;text-transform:lowercase}
.list{background:var(--surface);border:1px solid var(--line);border-radius:22px;overflow:hidden}
.it{display:grid;grid-template-columns:44px 1fr;align-items:center;border-top:1px solid var(--line)}
.it:first-child{border-top:0}
.it .tg{width:44px;height:100%;min-height:56px;display:grid;place-items:center;background:none;border:0;cursor:pointer;padding:0}
.it .tg i{width:20px;height:20px;border-radius:50%;border:1.6px solid var(--line);display:grid;place-items:center;color:var(--surface);font-style:normal;font-size:12px}
.it.lido .tg i{background:var(--ok);border-color:var(--ok)}
.it a{display:grid;grid-template-columns:52px 1fr;gap:10px;padding:11px 14px 11px 0;text-decoration:none;color:var(--ink);min-width:0}
.it .when{font-variant-numeric:tabular-nums;font-size:12px;color:var(--muted);line-height:1.3}
.it .when b{display:block;font:500 16px var(--f-disp);color:var(--plum)}
.it .what{min-width:0;font-size:14.5px;line-height:1.35}
.it .what small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.it.hoje{background:color-mix(in srgb,var(--rose-l) 30%,var(--surface))}
.it.hoje .when b::after{content:" · hoje";font:700 10px var(--f-ui);letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.it.atraso .when b{color:var(--accent)}
.it.lido .what{color:var(--muted)}
.fase{display:flex;align-items:baseline;gap:8px;margin:26px 4px 2px;font:600 12px var(--f-ui);letter-spacing:.12em;text-transform:uppercase;color:var(--lav)}

/* bíblia inteira */
.busca{display:flex;gap:8px;margin:0 0 6px}
.busca input{flex:1;min-width:0;border:1px solid var(--line);border-radius:999px;padding:12px 16px;font:16px var(--f-ui);background:var(--surface);color:var(--ink)}
.dica{font-size:12.5px;color:var(--muted);margin:0 6px 4px}
.tst{font:italic 400 18px var(--f-disp);color:var(--rose);margin:22px 4px 10px}
.bks{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px}
.bks a{display:flex;align-items:center;justify-content:center;text-align:center;min-height:46px;padding:8px 6px;border-radius:14px;background:var(--surface);border:1px solid var(--line);color:var(--ink);text-decoration:none;font-size:13.5px;line-height:1.2}
.caps{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:8px;margin-top:8px}
.caps a{display:grid;place-items:center;height:48px;border-radius:14px;background:var(--surface);border:1px solid var(--line);color:var(--ink);text-decoration:none;font:500 16px var(--f-disp)}
.caps a.lido{background:var(--lav-bg);border-color:transparent;color:var(--lav-ink)}
.res{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:22px;overflow:hidden}
.res a{display:block;padding:12px 16px;border-top:1px solid var(--line);text-decoration:none;color:var(--ink);font:15px/1.5 var(--f-read)}
.res a:first-child{border-top:0}
.res a b{display:block;font:700 12px var(--f-ui);letter-spacing:.06em;color:var(--rose);margin-bottom:2px}
.res mark{background:color-mix(in srgb,var(--a3) 45%,transparent);color:inherit;border-radius:3px;padding:0 1px}
.ponte{display:flex;flex-direction:column;gap:4px;margin-top:22px}

/* guia */
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 6px}
.chips a{padding:7px 12px;border-radius:999px;background:var(--surface);border:1px solid var(--line);color:var(--ink);text-decoration:none;font-size:13px}
.sec{scroll-margin-top:calc(16px + env(safe-area-inset-top,0px));margin-top:28px}
.sec > h2{font:400 24px/1.15 var(--f-disp);color:var(--plum);margin:0 4px 4px}
.sec > h2 i{color:var(--rose)}
.sec > p.sub{margin:0 4px 12px;color:var(--muted);font-size:14px}
.guia p{margin:0 0 .6em}
.guia ul{margin:0;padding-left:18px}
.guia li{margin:4px 0}
.ref-t{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:14.5px;align-items:baseline}
.ref-t code{font:600 14px var(--f-ui);color:var(--rose);white-space:nowrap}
.lib{display:flex;flex-direction:column;gap:12px}
.lib .g{display:flex;flex-direction:column;gap:6px}
.lib .gh{display:flex;align-items:center;gap:8px;font:700 11px var(--f-ui);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.lib .gh i{width:12px;height:12px;border-radius:4px}
.lib .tiles{display:flex;flex-wrap:wrap;gap:5px}
.lib .tiles a{padding:6px 9px;border-radius:9px;font-size:12.5px;color:#2B1D17;text-decoration:none;font-weight:500}
.lib .bar{display:flex;height:14px;border-radius:7px;overflow:hidden;margin:2px 0 6px}
.tl{position:relative;padding-left:26px}
.tl::before{content:"";position:absolute;left:8px;top:6px;bottom:6px;width:2px;border-radius:2px;background:linear-gradient(var(--a1),var(--a3) 45%,var(--a2))}
.tl .ev{position:relative;padding:0 0 18px}
.tl .ev::before{content:"";position:absolute;left:-23px;top:5px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:2.5px solid var(--rose)}
.tl .ev.nt::before{border-color:var(--ok)}
.tl .when{font:700 11px var(--f-ui);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.tl h3{font:500 18px/1.25 var(--f-disp);color:var(--plum);margin:2px 0 3px}
.tl p{margin:0 0 4px;font-size:14.5px}
.tl a{font-size:13px}
.tl .meio{margin:4px 0 18px -26px;padding:8px 12px;border-radius:12px;background:var(--lav-bg);color:var(--lav-ink);font:600 12px var(--f-ui);letter-spacing:.08em;text-transform:uppercase;text-align:center}
.lem{display:grid;gap:10px}
.lem .card{padding:14px 16px}
.lem h3{font:500 17px/1.25 var(--f-disp);color:var(--plum);margin:0 0 4px}
.lem p{margin:0 0 6px;font-size:14.5px}
.lem a,.cv a{font-size:13px;font-weight:600}
.cv{display:grid;gap:12px}
.cv .card{padding:0;overflow:hidden}
.cv h3{font:500 18px var(--f-disp);color:var(--plum);margin:0;padding:14px 16px 10px}
.cv .lado{padding:10px 16px 12px;border-top:1px solid var(--line);font-size:14.5px}
.cv .lado .k{display:flex;align-items:center;gap:6px;margin-bottom:3px}
.cv .lado p{margin:0 0 6px}
.cv .vs-chips{display:flex;flex-wrap:wrap;gap:6px}
.cv .vs-chips a{padding:4px 10px;border-radius:999px;border:1px solid var(--line);text-decoration:none;background:var(--bg)}
.resumo{font-size:15px;line-height:1.55;margin:0 0 6px}
.gtag{display:inline-flex;align-items:center;gap:6px;font:700 11px var(--f-ui);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.gtag i{width:10px;height:10px;border-radius:3px}

/* como usar */
.steps{display:flex;flex-direction:column;gap:14px}
.step{display:grid;grid-template-columns:30px 1fr;gap:10px;font-size:14.5px}
.step .sn{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--lav-bg);color:var(--lav-ink);font:600 14px var(--f-disp)}
.seg{display:inline-grid;grid-auto-flow:column;gap:4px;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:4px}
.seg button{border:0;background:none;border-radius:999px;padding:8px 14px;font:600 14px var(--f-ui);color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.fine{font-size:12.5px;color:var(--muted)}
.nm{display:flex;flex-direction:column;gap:10px;margin-bottom:14px}
.nmrow{display:flex;gap:8px}
.nmrow input{flex:1;min-width:0;border:1px solid var(--line);border-radius:999px;padding:11px 16px;font:16px var(--f-ui);background:var(--bg);color:var(--ink)}
.fases{margin:0;padding-left:20px;font-size:14px}
.fases li{margin:3px 0}
.fases small{color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(8px);background:var(--plum);color:var(--bg);
  padding:10px 16px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;z-index:40;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media (prefers-reduced-motion: reduce){.toast{transition:none}}
</style></head><body>
<main id="app" aria-live="polite"></main>
<div class="tabs"><nav aria-label="Seções">

is dos sacerdotes: sacrifícios, festas, regras de pureza. Tem também o “amarás o teu próximo como a ti mesmo” (19:18).","Os 40 anos do povo no deserto, com censos (por isso o nome), revoltas e a preparação pra entrar na terra prometida.","Os últimos discursos de Moisés antes de morrer, repetindo e explicando a Lei. É de onde vem o “ouve, Israel” e o texto contra consultar os mortos (18:10-12).","Josué, o sucessor de Moisés, conduz o povo na conquista da terra de Canaã.","Os tempos em que Israel não tinha rei: o povo se afastava de Deus e líderes como Débora, Gideão e Sansão salvavam a nação.","Uma história curta e bonita de lealdade: a estrangeira Rute fica com a sogra Noemi e se torna bisavó do rei Davi.","O profeta Samuel, o primeiro rei, Saul, e a ascensão de Davi (com Golias). Tem a cena da médium de En-Dor (cap. 28).","O reinado de Davi: suas vitórias, o pecado com Bate-Seba e as tragédias na família.","Salomão, o templo de Jerusalém e a divisão do reino em dois (Israel ao norte e Judá ao sul). Aparece o profeta Elias.","Os reis de Israel e de Judá até a queda dos dois reinos. O profeta Eliseu continua a obra de Elias.","Recontam a história de Davi, com foco no templo e no culto. Começa com longas genealogias.","Recontam a história de Salomão e dos reis de Judá até o exílio na Babilônia.","A volta do exílio e a reconstrução do templo, com o sacerdote Esdras ensinando a Lei.","Neemias lidera a reconstrução dos muros de Jerusalém e a reorganização do povo.","A rainha judia Ester arrisca a vida pra salvar o seu povo na Pérsia. É um livro que nem cita o nome de Deus.","Um homem justo que perde tudo e pergunta “por quê?”. É o grande livro sobre o sofrimento.","150 orações e cânticos (muitos atribuídos a Davi): louvor, tristeza, pedido de ajuda, gratidão. Tem o Salmo 23, “o Senhor é meu pastor”.","Conselhos curtos de sabedoria prática pra vida: trabalho, palavras, família, dinheiro.","Reflexão sobre o sentido da vida: “tudo é vaidade” e “há tempo pra tudo debaixo do céu”.","Poemas de amor entre um casal (também chamado Cantares ou Cântico dos Cânticos). Muitos leem também como símbolo do amor de Deus.","O maior profeta: denuncia a injustiça, consola o povo e anuncia o Servo sofredor (cap. 53), que os cristãos ligam a Jesus.","O profeta “chorão” avisa da destruição de Jerusalém e sofre por isso. Anuncia uma nova aliança escrita no coração (31:31-34).","Poemas de luto pela destruição de Jerusalém.","Profeta no exílio, com visões fortes: o carro de Deus, o vale de ossos secos que voltam à vida. Ensina que cada um responde pelos próprios atos (cap. 18).","Daniel na Babilônia: a cova dos leões, os amigos na fornalha e visões sobre o futuro.","Deus compara o povo infiel a uma esposa infiel e mesmo assim continua amando: “misericórdia quero, e não sacrifício”.","Uma praga de gafanhotos vira chamado ao arrependimento e a promessa de derramar o Espírito sobre todos (2:28).","O profeta da justiça social: contra quem explora os pobres e faz culto de aparência.","O livro mais curto do Antigo Testamento: aviso contra Edom, que se alegrou com a queda de Jerusalém.","O profeta que foge de Deus, é engolido por um grande peixe e aprende que Deus ama até os inimigos.","Contra a corrupção, e o resumo de tudo: praticar a justiça, amar a misericórdia e andar humildemente com Deus (6:8).","Anuncia a queda de Nínive, capital da Assíria, que tinha oprimido muitos povos.","Um profeta que discute com Deus por causa do mal no mundo e termina confiando: “o justo viverá pela fé”.","Anuncia o dia do Senhor e a salvação de um povo humilde.","Anima o povo que voltou do exílio a terminar o templo.","Visões que animam a reconstrução e anúncios de um rei humilde montado num jumentinho (9:9).","O último profeta do Antigo Testamento: critica o culto descuidado e anuncia a volta de Elias (4:5).","Escrito pra judeus: mostra Jesus cumprindo as profecias. Tem o Sermão do Monte e o Pai-Nosso.","O evangelho mais curto e mais antigo, cheio de ação. Mostra Jesus servindo e indo até a cruz.","Segundo a tradição, escrito por Lucas, um médico, com cuidado especial com os pobres, as mulheres e os excluídos. Tem o bom samaritano e o filho pródigo.","O evangelho mais espiritual: “nascer de novo”, “há muitas moradas”, o lava-pés, a ressurreição de Lázaro.","Continuação de Lucas: o Espírito Santo em Pentecostes, a primeira comunidade cristã e as viagens de Paulo.","A carta mais teológica de Paulo: todos precisam de Deus, e a salvação é pela fé e pela graça.","Conselhos a uma igreja cheia de problemas. Tem o hino ao amor (cap. 13) e os dons espirituais (cap. 12 e 14), que os espíritas relacionam à mediunidade.","Paulo abre o coração: sofrimentos, consolação e a força que aparece na fraqueza.","A liberdade em Cristo e o fruto do Espírito: amor, alegria, paz, paciência… “o que o ser humano semear, isso colherá” (6:7).","A unidade de todos em Cristo e conselhos pra família e pra vida cristã.","Uma carta alegre, escrita da prisão: “tudo posso naquele que me fortalece”.","Cristo acima de tudo e conselhos pra vida nova.","A primeira carta de Paulo: ânimo pra uma igreja nova e a esperança na volta de Cristo.","Esclarece mal-entendidos sobre a volta de Cristo e pede que todos trabalhem.","Conselhos de Paulo ao jovem Timóteo sobre como cuidar de uma comunidade.","A última carta de Paulo, já perto da morte: “combati o bom combate”.","Orientações a Tito, que cuidava das igrejas da ilha de Creta.","Bilhete pessoal pedindo que Filemom receba de volta o escravo Onésimo como irmão.","Jesus como o sacerdote perfeito e a galeria dos heróis da fé (cap. 11). O autor não é conhecido.","Fé sem obras é morta: uma carta muito prática sobre a língua, os pobres e a paciência.","Força pra quem sofre por ser cristão e convite a viver bem no meio das dificuldades.","Alerta contra falsos mestres e sobre a demora da volta de Cristo.","Deus é amor, e quem ama conhece a Deus. Também pede pra “provar os espíritos” (4:1).","Bilhete curto: andar no amor e cuidado com enganadores.","Bilhete curto elogiando quem acolhe os irmãos.","Alerta forte contra falsos mestres dentro das comunidades.","Visões cheias de símbolos sobre a luta entre o bem e o mal e a vitória final de Deus: novo céu e nova terra."],"linha":[["Origens","sem data","A criação, Adão e Eva, Noé, Babel. São narrativas antigas, que muita gente lê de forma simbólica.","Gênesis 1–11","#ler-0-1"],["Os patriarcas","~1800 a.C.","Abraão sai de Ur, depois vêm Isaque, Jacó (Israel) e José no Egito.","Gênesis 12–50","#ler-0-12"],["Moisés e o Êxodo","~1250 a.C.","Saída do Egito, os Dez Mandamentos e os 40 anos no deserto.","Êxodo a Deuteronômio","#ler-1-1"],["Josué e os juízes","~1200–1050 a.C.","A conquista de Canaã e o tempo sem reis.","Josué, Juízes, Rute","#ler-5-1"],["O reino unido","~1050–930 a.C.","Saul, Davi e Salomão. Davi escreve salmos, e Salomão constrói o templo.","1 e 2 Samuel, 1 Reis, Salmos, Provérbios","#ler-8-1"],["O reino dividido","930 a.C.","Israel (norte) e Judá (sul) se separam. Época dos profetas Elias, Eliseu, Amós, Oseias e Isaías.","1 e 2 Reis, profetas","#ler-10-12"],["Queda do norte","722 a.C.","A Assíria destrói Israel, o reino do norte.","2 Reis 17","#ler-11-17"],["Exílio na Babilônia","587/586 a.C.","Jerusalém e o templo são destruídos e o povo vai preso pra Babilônia. Profetas: Jeremias, Ezequiel e Daniel.","2 Reis 25, Jeremias, Lamentações","#ler-11-25"],["A volta","538 a.C.","Os persas deixam o povo voltar. O templo e os muros são reconstruídos.","Esdras, Neemias, Ageu, Zacarias","#ler-14-1"],["Silêncio dos profetas","~400 a.C.","Malaquias é o último profeta. São uns 400 anos até Jesus, e nesse tempo os gregos e depois os romanos dominam a região.","Malaquias","#ler-38-1"],["Nasce Jesus","~6–4 a.C.","Em Belém, no tempo do rei Herodes. A conta do calendário errou por alguns anos.","Mateus 1–2, Lucas 1–2","#ler-41-2"],["Ministério de Jesus","~27–30 d.C.","Uns 3 anos de ensino e curas, até a cruz e a ressurreição em Jerusalém.","Evangelhos","#ler-39-5"],["Os primeiros cristãos","~30–60 d.C.","Pentecostes, as viagens de Paulo e as cartas às igrejas.","Atos e as cartas","#ler-43-2"],["Destruição do templo","70 d.C.","Os romanos destroem Jerusalém e o templo, como Jesus tinha avisado.","Mateus 24","#ler-39-24"],["Escrita dos evangelhos","~65–100 d.C.","Marcos é o primeiro e João, o último. O Apocalipse é de ~95 d.C.","Evangelhos e Apocalipse","#ler-40-1"]],"lembrar":[["Os dois maiores mandamentos","Amar a Deus de todo o coração e o próximo como a si mesmo. Jesus diz que toda a Lei cabe aí.","Mateus 22:37-40","#ler-39-22-37-40"],["A regra de ouro","Fazer aos outros o que você quer que façam com você.","Mateus 7:12","#ler-39-7-12"],["O Pai-Nosso","A oração que Jesus ensinou.","Mateus 6:9-13","#ler-39-6-9-13"],["As bem-aventuranças","Felizes os humildes, os que choram, os mansos, os misericordiosos, os pacificadores…","Mateus 5:3-12","#ler-39-5-3-12"],["Os Dez Mandamentos","A Lei dada a Moisés no Sinai. Kardec diz que essa parte moral da Lei é eterna.","Êxodo 20:1-17","#ler-1-20-1-17"],["O hino ao amor","“O amor é paciente, é bondoso…” Sem amor, nada vale.","1 Coríntios 13","#ler-45-13"],["O fruto do Espírito","Amor, alegria, paz, paciência, benignidade, bondade, fidelidade, mansidão e domínio próprio.","Gálatas 5:22-23","#ler-47-5-22-23"],["Colhe o que planta","“O que o ser humano semear, isso também colherá.” É a lei de causa e efeito.","Gálatas 6:7","#ler-47-6-7"],["As três revelações","Pro Espiritismo, Moisés trouxe a Lei (1ª revelação), Jesus trouxe o amor (2ª) e o Espiritismo é o Consolador prometido por Jesus (3ª), que explica e relembra o que ele ensinou.","João 14:15-17, 26","#ler-42-14-15-26"],["Ler com olhos espíritas","Kardec separa os ensinos morais de Jesus (que todos aceitam) dos trechos que geram polêmica (milagres, profecias, dogmas). O foco do Espiritismo é a moral: a transformação de cada um.","O Evangelho segundo o Espiritismo, Introdução",""]],"conversa":[["Reencarnação","O Espírito volta em novos corpos pra aprender e reparar erros.",[["João 3:3-7","#ler-42-3-3-7"],["Mateus 11:14","#ler-39-11-14"],["Mateus 17:10-13","#ler-39-17-10-13"],["João 9:2","#ler-42-9-2"]],"Cada pessoa vive uma vez só e depois vem o juízo. João Batista veio “no espírito de Elias”, mas não era Elias.",[["Hebreus 9:27","#ler-57-9-27"],["Lucas 1:17","#ler-41-1-17"],["João 1:21","#ler-42-1-21"]]],["Falar com os mortos","Os Espíritos podem se comunicar, mas é preciso “provar os espíritos” e buscar só o bem.",[["Mateus 17:3","#ler-39-17-3"],["1 Samuel 28:11-15","#ler-8-28-11-15"],["1 João 4:1","#ler-61-4-1"]],"Deus proíbe consultar os mortos, e os fenômenos podem vir de espíritos enganadores.",[["Deuteronômio 18:10-12","#ler-4-18-10-12"],["Levítico 19:31","#ler-2-19-31"],["Isaías 8:19","#ler-22-8-19"]]],["Salvação","Cada um se salva pela própria transformação e pela caridade: “fora da caridade não há salvação”.",[["Mateus 16:27","#ler-39-16-27"],["Mateus 25:31-46","#ler-39-25-31-46"],["Tiago 2:17","#ler-58-2-17"]],"A salvação é presente de Deus, recebido pela fé em Jesus, e não se ganha pelas obras.",[["Efésios 2:8-9","#ler-48-2-8-9"],["Romanos 3:28","#ler-44-3-28"],["João 14:6","#ler-42-14-6"]]],["Inferno e castigo","Não existe pena eterna: o sofrimento dura enquanto o Espírito não se arrepende e não repara o mal.",[["Ezequiel 18:23","#ler-25-18-23"],["Mateus 5:25-26","#ler-39-5-25-26"],["Lucas 15:11-32","#ler-41-15-11-32"]],"Quem não aceita a salvação vai pra uma separação eterna de Deus.",[["Mateus 25:46","#ler-39-25-46"],["Apocalipse 20:10","#ler-65-20-10"]]],["Quem é Jesus","O Espírito mais perfeito que Deus enviou como modelo, mas não é o próprio Deus.",[["João 14:28","#ler-42-14-28"],["Marcos 10:18","#ler-40-10-18"]],"Jesus é Deus (a Trindade: Pai, Filho e Espírito Santo).",[["João 1:1","#ler-42-1-1"],["João 10:30","#ler-42-10-30"]]],["Ressurreição","O Espírito sobrevive com um corpo espiritual (perispírito). O corpo físico não volta.",[["1 Coríntios 15:44","#ler-45-15-44"],["Mateus 22:30","#ler-39-22-30"]],"No fim dos tempos, os mortos voltam a ter o corpo, transformado.",[["João 5:28-29","#ler-42-5-28-29"],["1 Coríntios 15:52","#ler-45-15-52"]]],["Outros mundos","“Há muitas moradas na casa de meu Pai” também quer dizer outros mundos habitados.",[["João 14:2","#ler-42-14-2"]],"As moradas são os lugares preparados no céu pros salvos.",[["João 14:2-3","#ler-42-14-2-3"]]]]}}</script>
<script>
(function(){
const DATA = JSON.parse(document.getElementById('data').textContent);
const DAYS = DATA.days, FASES = DATA.fases, LIVROS = DATA.livros, G = DATA.guia;  // livro: [nome, abrev, capítulos, AT/NT, dia de cada capítulo]
let COM = {};                       // comentários: comentarios.json (atualizado toda semana)
const TXT = {};                     // textos já baixados
const MESES=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const SEM=['domingo','segunda-feira','terça-feira','quarta-feira','quinta-feira','sexta-feira','sábado'];
const AURAS=[['15% 20%','85% 35%','45% 95%'],['80% 15%','10% 60%','70% 90%'],['30% 85%','90% 70%','20% 10%'],['60% 10%','5% 40%','95% 95%'],['10% 90%','75% 25%','40% 40%'],['90% 85%','25% 20%','55% 60%']];
const aura = k => { const [a,b,c]=AURAS[k%AURAS.length];
  return `background:radial-gradient(circle at 50% 50%,var(--aw) 0,transparent 32%),radial-gradient(circle at ${a},var(--a1) 0,transparent 62%),radial-gradient(circle at ${b},var(--a2) 0,transparent 62%),radial-gradient(circle at ${c},var(--a3) 0,transparent 62%),var(--abase)`; };
const COR = {terra:'#E0957A',mar:'#82B2CE',trigo:'#E6C27E',luz:'#C9A3E3'};
const dot = k => `<span class="dot" style="background:${COR[k]}"></span>`;
const pd = iso => { const [y,m,d]=iso.split('-').map(Number); return new Date(y,m-1,d); };
const longo = iso => { const d=pd(iso); return `${SEM[d.getDay()]}, ${d.getDate()} de ${MESES[d.getMonth()]}`; };
const curto = iso => { const d=pd(iso); return `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}`; };
const todayISO = () => { const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };
const byN = n => DAYS[n-1];
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const inline = s => esc(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
const titulo = d => (COM[d.n] && COM[d.n].titulo) || d.ref;
const $app = document.getElementById('app');

/* ---------- estado ---------- */
const LS='biblia-espirita-v1';
let state = { lidos: [], fs: 17, t: 0, nome: '' };
try { const s = JSON.parse(localStorage.getItem(LS)||'null'); if (s && Array.isArray(s.lidos)) state = Object.assign(state, s); } catch(e){}
let lidos = new Set(state.lidos);
function persist(){ state.lidos=[...lidos].sort((a,b)=>a-b); state.t=Date.now(); try { localStorage.setItem(LS, JSON.stringify(state)); } catch(e){} }
function applyFs(){ document.documentElement.style.setProperty('--fs', state.fs+'px'); }
applyFs();
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toast.h); toast.h=setTimeout(()=>t.classList.remove('show'),1800); }
function toggle(n){ if (lidos.has(n)) { lidos.delete(n); toast('Desmarcado'); } else { lidos.add(n); toast('Leitura marcada como lida ♡'); } persist(); }

/* ---------- dados de fora ---------- */
fetch('comentarios.json', {cache:'no-store'}).then(r => r.ok ? r.json() : {}).then(j => { COM = j || {}; render(false); }).catch(() => {});
function texto(n){
  if (TXT[n]) return Promise.resolve(TXT[n]);
  return fetch(`textos/${String(n).padStart(3,'0')}.json`).then(r => { if(!r.ok) throw 0; return r.json(); }).then(j => (TXT[n]=j));
}
// "Mateus 5:14-16" -> {l, c, a, z}
function parseRef(r){ const m = String(r||'').match(/^(.+?)\s+(\d+):(\d+)(?:\s*[-–]\s*(\d+))?$/); return m ? {l:m[1], c:+m[2], a:+m[3], z:+(m[4]||m[3])} : null; }
function versiculo(n){
  const c = COM[n]; const r = c && parseRef(c.chave); if (!r) return Promise.resolve(null);
  return texto(n).then(caps => { const k = caps.find(x => x.l===r.l && x.c===r.c); if (!k) return null;
    return { ref: `${r.l} ${r.c}:${r.a}${r.z!==r.a?'–'+r.z:''}`, txt: k.v.slice(r.a-1, r.z).join(' '), r }; }).catch(() => null);
}
function htmlTexto(caps, n){
  const r = COM[n] && parseRef(COM[n].chave);
  const multi = new Set(caps.map(x=>x.l)).size > 1; let o = '', last = '';
  caps.forEach(k => {
    if (multi && k.l !== last) { o += `<h2 class="bl">${esc(k.l)}</h2>`; last = k.l; }
    if (k.n > 1) o += `<h3 class="cap">${k.l==='Salmos'?'Salmo':'Capítulo'} ${k.c}</h3>`;
    if (k.s) o += `<p class="sobre">${esc(k.s)}</p>`;
    o += '<p class="vv">' + k.v.map((v,i) => { const vk = r && r.l===k.l && r.c===k.c && i+1>=r.a && i+1<=r.z;
      return `<sup>${i+1}</sup>${vk?'<span class="vk">':''}${esc(v)}${vk?'</span>':''}`; }).join(' ') + '</p>';
  });
  return o;
}

/* ---------- views ---------- */
function plan(){
  const t = todayISO();
  const hoje = DAYS.find(d=>d.date===t);
  const firstUnread = DAYS.find(d=>!lidos.has(d.n));
  const atrasadas = DAYS.filter(d=>d.date<t && !lidos.has(d.n));
  let alvo, rot;
  if (hoje && !lidos.has(hoje.n) && !atrasadas.length) { alvo=hoje; rot='leitura de hoje'; }
  else if (atrasadas.length) { alvo=atrasadas[0]; rot = 'continuar de onde parou'; }
  else if (firstUnread) { alvo=firstUnread; rot = firstUnread.date===t ? 'leitura de hoje' : 'próxima leitura · '+longo(firstUnread.date); }
  return {t, hoje, alvo, rot, atrasadas};
}

function vHoje(){
  const {t, hoje, alvo, rot, atrasadas} = plan();
  const h = new Date().getHours();
  const saud = h<12 ? 'Bom dia' : h<18 ? 'Boa tarde' : 'Boa noite';
  let o = `<div class="hello"><span class="k">${longo(t)}</span><h1>${saud}${state.nome?`, <i>${esc(state.nome)}</i>`:' <i>♡</i>'}</h1></div>`;
  if (!state.nome) o += `<form class="card nm" id="nmForm"><label for="nmIn" class="k">como você quer ser chamada?</label><div class="nmrow"><input id="nmIn" name="nome" autocomplete="given-name" placeholder="Seu nome" maxlength="30"><button class="btn" type="submit">Salvar</button></div></form>`;
  if (alvo){
    o += `<section class="aura hero" style="${aura(alvo.n)}">
      <span class="k">${rot}</span>
      <div><div class="dn">Dia ${alvo.n} · ${esc(alvo.faseNome)}</div><h2>${esc(titulo(alvo))}</h2></div>
      <div class="meta">${esc(alvo.ref)} · ≈ ${alvo.mins} min de leitura</div>
      <div><a class="btn" href="#dia-${alvo.n}">Ler agora</a></div></section>`;
    if (hoje && lidos.has(hoje.n) && alvo.n!==hoje.n) o += `<p class="note">A leitura de hoje (Dia ${hoje.n}) já está feita ♡</p>`;
    else if (!hoje && t < DAYS[0].date) o += `<p class="note">A leitura começa ${longo(DAYS[0].date)}.</p>`;
    else if (!hoje) o += `<p class="note">Hoje não tem leitura no cronograma. ${atrasadas.length? 'Dá pra pôr em dia, sem pressa.' : 'Aproveite o descanso.'}</p>`;
    if (atrasadas.length>1) o += `<p class="note">${atrasadas.length} leituras pra pôr em dia. É só seguir na ordem.</p>`;
  } else {
    o += `<section class="aura hero" style="${aura(2)}"><span class="k">fim</span><h2>Você leu a Bíblia inteira ♡</h2><p>De Gênesis ao Apocalipse.</p></section>`;
  }
  const nl = lidos.size, pct = Math.round(nl/DAYS.length*100), fim = DAYS[DAYS.length-1].date;
  o += `<div class="stack"><section class="card prog"><span class="k">seu caminho</span>
     <div class="big">${nl} <small>de ${DAYS.length} leituras · ${pct}%</small></div>
     <div class="bar"><i style="width:${pct}%"></i></div>
     <div class="sub">Termina em ${longo(fim)} de ${fim.slice(0,4)}, se seguir o cronograma.</div>
     ${semana(alvo)}</section>`;
  const vd = alvo || DAYS[DAYS.length-1], c = COM[vd.n];
  o += `<section class="card" id="vsCard" hidden><div class="bh">${dot('mar')}<span>versículo do dia</span></div><p class="vs" id="vsTxt"></p><div class="ref" id="vsRef"></div></section>`;
  if (c && c.hoje) o += `<section class="card"><div class="bh">${dot('terra')}<span>pra hoje</span></div><p style="margin:8px 0 0;font-size:15px">${inline(c.hoje)}</p></section>`;
  o += '</div>';
  versiculo(vd.n).then(v => { const card=document.getElementById('vsCard'); if (!v || !card) return;
    document.getElementById('vsTxt').textContent = '“'+v.txt+'”'; document.getElementById('vsRef').textContent = v.ref+' · Bíblia Livre'; card.hidden=false; });
  return o;
}
function semana(alvo){
  const ref = alvo ? pd(alvo.date) : new Date();
  const seg = new Date(ref); seg.setDate(ref.getDate() - ((ref.getDay()+6)%7));
  const t = todayISO(); let o = '<div class="week">';
  for (let i=0;i<5;i++){ const d=new Date(seg); d.setDate(seg.getDate()+i);
    const iso=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    const dd = DAYS.find(x=>x.date===iso); const wd = SEM[d.getDay()].slice(0,3);
    if (!dd) { o += `<a class="off" aria-disabled="true"><span class="wd">${wd}</span><span class="c">–</span>${d.getDate()}</a>`; continue; }
    const cls = lidos.has(dd.n)?'lido':(iso===t?'hoje':'');
    o += `<a class="${cls}" href="#dia-${dd.n}" aria-label="Dia ${dd.n}, ${longo(iso)}${lidos.has(dd.n)?', lido':''}"><span class="wd">${wd}</span><span class="c">${lidos.has(dd.n)?'✓':dd.n}</span>${curto(iso)}</a>`; }
  return o + '</div>';
}

function vDia(n){
  const d = byN(n); if (!d) return vHoje();
  const lido = lidos.has(n), p = byN(n-1), nx = byN(n+1), c = COM[n];
  const esp = c && c.explicacao ? c.explicacao.trim().split('\n').filter(x=>x.trim()).map(x =>
      /^\*\*Pra conversar:\*\*/.test(x) ? `<p class="conv">${inline(x)}</p>` : `<p>${inline(x)}</p>`).join('') : '';
  texto(n).then(caps => { const el=document.getElementById('txt'); if (el && location.hash==='#dia-'+n) { el.innerHTML = htmlTexto(caps, n); onScroll(); } })
    .catch(() => { const el=document.getElementById('txt'); if (el) el.innerHTML='<p class="loading">Não deu pra carregar o texto agora. Confira a internet e abra de novo.</p>'; });
  return `<div class="rbar"><div class="in">

const norm = s => String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[.]/g,'').replace(/\s+/g,' ').trim();
const ALIAS = {};
LIVROS.forEach((b,i) => { [b[0], b[1]].forEach(x => { ALIAS[norm(x)] = i; ALIAS[norm(x).replace(/ /g,'')] = i; }); });
Object.assign(ALIAS, {'salmo':18,'sal':18,'cantares':21,'cantico':21,'canticos':21,'cantico dos canticos':21,'oseias':27,'apoc':65,'ex':1,'jo':42});
function acharLivro(raw){
  const r = raw.toLowerCase().replace(/[.]/g,'').trim();
  if (r==='jó' || r==='jo\u0301') return 17;
  const n = norm(r); if (n in ALIAS) return ALIAS[n]; if (n.replace(/ /g,'') in ALIAS) return ALIAS[n.replace(/ /g,'')];
  if (n.length < 2) return -1;
  const c = LIVROS.map((b,i)=>[norm(b[0]),i]).filter(([x]) => x.startsWith(n) || x.replace(/ /g,'').startsWith(n.replace(/ /g,'')));
  return c.length ? c[0][1] : -1;
}
// "joão 3:16", "1co 13", "salmo 23", "gn 1:1-3"
function lerRef(q){
  const m = q.trim().match(/^([1-3]?\s*[^\d:]+?)\s*(\d+)?(?:\s*[:.,]\s*(\d+)(?:\s*[-–]\s*(\d+))?)?$/);
  if (!m) return null; const i = acharLivro(m[1]); if (i<0) return null;
  if (LIVROS[i][2]===1 && m[2] && !m[3]) return {i, c:1, a:+m[2], z:+m[2], exato:true};   // Judas 3 = versículo 3
  const c = m[2] ? Math.min(+m[2], LIVROS[i][2]) : 0;
  const exato = norm(m[1]) in ALIAS || LIVROS.some(x => norm(x[0])===norm(m[1]));
  return {i, c, a: m[3]?+m[3]:0, z: m[4]?+m[4]:(m[3]?+m[3]:0), exato};
}

let BUSCA = null;
function carregaBusca(){ return BUSCA ? Promise.resolve(BUSCA) : fetch('busca.json').then(r=>r.json()).then(j => (BUSCA = j.map(([i,c,vs]) => [i,c,vs,vs.map(norm)]))); }
const ACENTO = {a:'[aáàâã]',e:'[eéèê]',i:'[iíì]',o:'[oóòôõ]',u:'[uúùü]',c:'[cç]'};
function vBusca(q){
  const r = lerRef(q);
  if (r && /\d/.test(q)) { location.replace(caminho(r)); return ''; }
  const PARAR = new Set(['de','da','do','das','dos','a','o','as','os','e','que','em','no','na','nos','nas','um','uma','para','pra','por','se','com','ao','aos','é']);
  const ws0 = norm(q).split(' ').filter(w=>w.length>1), ws = ws0.filter(w=>!PARAR.has(w)).length ? ws0.filter(w=>!PARAR.has(w)) : ws0;
  setTimeout(() => {
    if (!ws.length) { document.getElementById('res').innerHTML = '<p class="note">Digite pelo menos uma palavra.</p>'; return; }
    carregaBusca().then(B => {
      let hits = [], parecidos = false;
      for (const [i,c,vs,ns] of B) ns.forEach((x,j) => { if (ws.every(w => x.includes(w))) hits.push([i,c,j+1,vs[j]]); });
      if (!hits.length && ws.length > 1) {   // nenhum versículo com todas as palavras: mostra os que têm mais delas
        const sc = []; for (const [i,c,vs,ns] of B) ns.forEach((x,j) => { const k = ws.filter(w => x.includes(w)).length; if (k) sc.push([k,i,c,j+1,vs[j]]); });
        const mx = Math.max(0, ...sc.map(x=>x[0])); hits = sc.filter(x=>x[0]===mx).map(x=>x.slice(1)); parecidos = hits.length>0;
      }
      const re = new RegExp('(' + ws.map(w => w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&').replace(/[aeiouc]/g, ch => ACENTO[ch])).join('|') + ')', 'gi');
      const el = document.getElementById('res'); if (!el) return;
      const livroAchado = r && !/\d/.test(q) ? `<p class="note" style="margin-top:0">Quer abrir o livro? <a href="#livro-${r.i}">${esc(LIVROS[r.i][0])}</a></p>` : '';
      el.innerHTML = livroAchado + (hits.length ? `<p class="note" style="margin:0 4px 10px">${parecidos?'Nenhum versículo tem todas essas palavras (a tradução pode usar outras, tipo “voltar a nascer” em vez de “nascer de novo”). Os mais parecidos: ':''}${hits.length} versículo${hits.length>1?'s':''}${hits.length>300?' (mostrando os 300 primeiros)':''}</p><div class="res">` +
        hits.slice(0,300).map(([i,c,v,t]) => `<a href="#ler-${i}-${c}-${v}"><b>${esc(LIVROS[i][0])} ${c}:${v}</b>${esc(t).replace(re,'<mark>$1</mark>')}</a>`).join('') + '</div>'
        : '<p class="note">Nada encontrado. Tente outra palavra ou só o começo dela.</p>');
    }).catch(() => { const el=document.getElementById('res'); if (el) el.innerHTML='<p class="note">Não deu pra carregar a busca agora. Confira a internet.</p>'; });
  });
  return `<div class="rbar"><div class="in"><a class="ib" href="#livros" aria-label="Voltar aos livros"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M15 5l-7 7 7 7"/></svg></a><div class="t">Busca</div><span class="ib"></span></div></div>
    ${formBusca(q)}<div id="res" style="margin-top:12px"><p class="loading" style="margin:8px 6px">Procurando na Bíblia inteira…</p></div>`;
}

        `<div class="g"><div class="gh"><i style="background:${g[1]}"></i>${esc(g[0])}</div><div class="tiles">${LIVROS.slice(g[2],g[3]+1).map((b,k)=>`<a href="#livro-${g[2]+k}" style="background:${g[1]}">${esc(b[0])}</a>`).join('')}</div></div>`).join('')).join('')}
    </div></section>

  <section class="sec" id="g-tempo"><h2>Linha do <i>tempo</i></h2><p class="sub">As datas são aproximadas, e algumas os historiadores ainda discutem.</p>
    <div class="card tl">${G.linha.map((e,k)=>(k===10?'<div class="meio">Novo Testamento</div>':'')+`<div class="ev ${k>=10?'nt':''}"><div class="when">${esc(e[1])}</div><h3>${esc(e[0])}</h3><p>${esc(e[2])}</p>${e[4]?`<a href="${e[4]}">${esc(e[3])} ›</a>`:`<span class="ref">${esc(e[3])}</span>`}</div>`).join('')}</div></section>

  <section class="sec" id="g-lembrar"><h2>Pra sempre <i>lembrar</i></h2><p class="sub">Os trechos e ideias que aparecem o tempo todo.</p>
    <div class="lem">${G.lembrar.map(e=>`<div class="card"><h3>${esc(e[0])}</h3><p>${esc(e[1])}</p>${e[3]?`<a href="${e[3]}">${esc(e[2])} ›</a>`:`<span class="ref">${esc(e[2])}</span>`}</div>`).join('')}</div></section>

  <section class="sec" id="g-conversar"><h2>Pra <i>conversar</i></h2><p class="sub">Os pontos em que espíritas e evangélicos leem diferente, e os versículos que cada lado costuma citar. Vale ler os dois lados com respeito.</p>
    <div class="cv">${G.conversa.map(c=>`<div class="card"><h3>${esc(c[0])}</h3>
      <div class="lado"><div class="k">${dot('trigo')}visão espírita</div><p>${esc(c[1])}</p><div class="vs-chips">${c[2].map(v=>`<a href="${v[1]}">${esc(v[0])}</a>`).join('')}</div></div>
      <div class="lado"><div class="k">${dot('mar')}leitura evangélica</div><p>${esc(c[3])}</p><div class="vs-chips">${c[4].map(v=>`<a href="${v[1]}">${esc(v[0])}</a>`).join('')}</div></div></div>`).join('')}</div></section>

  <section class="sec" id="g-sobre"><h2>Como usar o <i>app</i></h2>${vSobre()}</section>`;
}

/* ---------- roteador ---------- */
let lastView = '';
function render(scroll=true){
  const h = (location.hash||'#hoje').slice(1);
  let html, tab='hoje', m;
  if ((m=h.match(/^dia-(\d+)$/))) { html=vDia(+m[1]); tab='cronograma'; }
  else if (h==='cronograma') { html=vCrono(); tab='cronograma'; }
  else if (h==='livros') { html=vLivros(); tab='livros'; }
  else if ((m=h.match(/^livro-(\d+)$/))) { html=vLivro(+m[1]); tab='livros'; }
  else if ((m=h.match(/^ler-(\d+)-(\d+)(?:-(\d+)(?:-(\d+))?)?$/))) { html=vLer(+m[1],+m[2],m[3]?+m[3]:0,m[4]?+m[4]:0); tab='livros'; }
  else if ((m=h.match(/^busca=(.*)$/))) { html=vBusca(decodeURIComponent(m[1])); tab='livros'; }
  else if (h==='guia' || h==='sobre' || /^guia-/.test(h)) { html=vGuia(); tab='guia'; }
  else html=vHoje();
  const y = window.scrollY;
  $app.innerHTML = html;
  document.querySelectorAll('.tabs a').forEach(a=>{ if(a.dataset.tab===tab) a.setAttribute('aria-current','page'); else a.removeAttribute('aria-current'); });
  if ((m=h.match(/^guia-(\w+)$/))) { const el=document.getElementById('g-'+m[1]); if (el) { el.scrollIntoView(); lastView=h; return; } }
  if (scroll && h!==lastView) {
    if (h==='cronograma') { const p=plan(); const el=p.alvo && document.getElementById('c'+p.alvo.n); window.scrollTo(0, el ? Math.max(0, el.getBoundingClientRect().top + window.scrollY - 160) : 0); }
    else window.scrollTo(0,0);
  } else window.scrollTo(0,y);
  lastView = h;
  onScroll();
}
window.addEventListener('hashchange', ()=>render(true));

$app.addEventListener('click', e => {
  const tg = e.target.closest('.tg');
  if (tg && tg.dataset.n) { toggle(+tg.dataset.n); render(false); return; }
  const m = (location.hash||'').match(/^#dia-(\d+)$/);
  if (m && (e.target.closest('#chkTop') || e.target.closest('#chkBig'))) { toggle(+m[1]); render(false); return; }
  if (e.target.closest('#fsBtn')) { const s=[15,17,19,21]; state.fs = s[(s.indexOf(state.fs)+1)%s.length] || 17; applyFs(); persist(); toast('Letra '+['pequena','normal','grande','maior'][s.indexOf(state.fs)]); onScroll(); return; }
  const fb = e.target.closest('[data-fs]');
  if (fb) { state.fs=+fb.dataset.fs; applyFs(); persist(); render(false); }
});
function onScroll(){
  const rp = document.getElementById('rp'); if (!rp) return;
  const art = document.querySelector('.reader'); if (!art) return;
  const top = art.getBoundingClientRect().top + window.scrollY, h = art.offsetHeight - window.innerHeight*0.6;
  const p = Math.min(1, Math.max(0, (window.scrollY - top + window.innerHeight*0.3) / Math.max(1,h)));
  rp.style.width = (p*100).toFixed(1)+'%';
}
window.addEventListener('scroll', onScroll, {passive:true});
$app.addEventListener('submit', e => { if (e.target.id!=='buscaForm') return; e.preventDefault();
  const q = document.getElementById('buscaIn').value.trim(); if (!q) return; document.getElementById('buscaIn').blur();
  const r = lerRef(q); location.hash = (r && (/\d/.test(q) || r.exato)) ? caminho(r) : 'busca=' + encodeURIComponent(q); });
$app.addEventListener('submit', e => { if (e.target.id!=='nmForm') return; e.preventDefault(); const v=document.getElementById('nmIn').value.trim(); if (!v) return; state.nome=v.slice(0,30); persist(); render(false); toast('Prazer, '+state.nome+' ♡'); });
$app.addEventListener('click', e => { const a=e.target.closest('a[href^="http"]'); if (a) { a.target='_blank'; a.rel='noopener'; } }, true);
render(true);
})();
</script></body></html>
